name: CI

on:
  push:
    branches:
      - main
      - feature/workcell-platform-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Docker test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build development image
        run: docker build --tag writing-robot:ci .

      - name: Run automated tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            writing-robot:ci \
            python3 -m pytest -q
